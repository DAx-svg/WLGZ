<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量出库</title>
    <link href="https://cdn.staticfile.org/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.staticfile.org/bootstrap-icons/1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; background: #f5f7fa; }
        .sn-chip {
            display: inline-flex; align-items: center; gap: 4px;
            background: #e7f1ff; border: 1px solid #0d6efd; border-radius: 20px;
            padding: 4px 12px; margin: 3px; font-size: 0.9rem; font-family: monospace;
        }
        .sn-chip .remove { cursor: pointer; color: #dc3545; font-weight: bold; font-size: 1.1rem; line-height: 1; }
        .sn-chip .remove:hover { color: #a71d2a; }
        .sn-chip.not-ok { background: #ffe0e0; border-color: #dc3545; color: #888; text-decoration: line-through; }
        .search-result { cursor: pointer; transition: background 0.15s; }
        .search-result:hover { background: #e7f1ff; }
        .search-result.disabled { opacity: 0.5; pointer-events: none; }
        .sn-pick {
            display: inline-flex; align-items: center; gap: 4px;
            background: #f0fff4; border: 1px solid #198754; border-radius: 20px;
            padding: 4px 14px; margin: 3px; font-size: 0.9rem; font-family: monospace;
            cursor: pointer; transition: all 0.15s;
        }
        .sn-pick:hover { background: #198754; color: white; border-color: #198754; }
        .sn-pick.picked { background: #e7f1ff; border-color: #0d6efd; cursor: default; opacity: 0.6; pointer-events: none; }
    </style>
</head>
<body>
<div class="container">

    <!-- 顶栏 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0"><i class="bi bi-box-arrow-right"></i> 批量出库</h5>
        <a href="/" class="btn btn-outline-secondary btn-sm" id="backBtn"><i class="bi bi-arrow-left"></i> 返回首页</a>
    </div>

    <div class="row g-3">
        <!-- 左栏：选物料 -->
        <div class="col-md-7">
            <!-- 搜索 + 品类筛选 -->
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <!-- 品类筛选 -->
                    <label class="form-label fw-bold"><i class="bi bi-funnel"></i> 按品类筛选在库物料</label>
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <select class="form-select" id="parentSelect" onchange="onParentChange()">
                                <option value="">-- 大类 --</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-6">
                            <select class="form-select" id="subSelect" onchange="onSubChange()" disabled>
                                <option value="">-- 小类 --</option>
                            </select>
                        </div>
                    </div>
                    <!-- 关键词搜索（辅助） -->
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchInput"
                            placeholder="或输入 SN 关键字搜索">
                        <button class="btn btn-outline-secondary" type="button" onclick="clearAllFilters()">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                    <!-- 结果区 -->
                    <div id="searchResults" class="mt-3" style="max-height:350px;overflow-y:auto;">
                        <div class="text-muted text-center py-3">
                            <i class="bi bi-arrow-up"></i> 选择品类后可点选在库物料
                        </div>
                    </div>
                </div>
            </div>

            <!-- 已选物料 -->
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-check2-square"></i> 已选物料 <span id="countBadge" class="badge bg-primary">0</span></span>
                    <button class="btn btn-outline-danger btn-sm" onclick="clearAll()" id="clearAllBtn" disabled>
                        <i class="bi bi-trash"></i> 清空
                    </button>
                </div>
                <div class="card-body" id="selectedList" style="min-height:80px;">
                    <div class="text-muted text-center py-3" id="emptyHint">
                        <i class="bi bi-inbox" style="font-size:2rem;"></i>
                        <p class="mt-1 mb-0">搜索并添加要出库的物料</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右栏：出库信息 -->
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header"><i class="bi bi-info-circle"></i> 出库信息（共用）</div>
                <div class="card-body">
                    <form id="batchForm">
                        <div class="mb-3">
                            <label class="form-label">出库用途 <span class="text-danger">*</span></label>
                            <select class="form-select" id="purpose" required>
                                <option value="">-- 请选择 --</option>
                                <option value="销售出库">销售出库</option>
                                <option value="售后出库">售后出库</option>
                                <option value="测试出库">测试出库</option>
                                <option value="其他出库">其他出库</option>
                            </select>
                        </div>
                        <div id="purposeDetailBox" class="mb-3" style="display:none;">
                            <label class="form-label" id="purposeDetailLabel">用途说明</label>
                            <textarea class="form-control" id="purposeDetail" rows="2"></textarea>
                            <!-- 寄回追踪（仅售后出库显示） -->
                            <div id="returnCheckGroup" style="display:none;" class="mt-2">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="needReturn" onchange="document.getElementById('returnFields').style.display=this.checked?'':'none'">
                                    <label class="form-check-label" for="needReturn">需要客户寄回故障件</label>
                                </div>
                                <div id="returnFields" style="display:none;">
                                    <div class="mb-2"><label class="form-label">客户需寄回的故障件 SN</label><input class="form-control" id="returnSn" placeholder="可后续补充" style="font-family:monospace;"></div>
                                    <div class="row g-2">
                                        <div class="col-6"><label class="form-label">寄回快递公司</label><input class="form-control" id="returnCourier" placeholder="可后续补充"></div>
                                        <div class="col-6"><label class="form-label">寄回快递单号</label><input class="form-control" id="returnTracking" placeholder="可后续补充"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">联系人</label>
                                <input type="text" class="form-control" id="customerName" placeholder="例如：张三">
                            </div>
                            <div class="col-6">
                                <label class="form-label">联系方式</label>
                                <input type="text" class="form-control" id="customerContact" placeholder="电话/微信">
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">公司名称</label>
                                <textarea class="form-control" id="customerCompany" rows="2" placeholder="客户公司抬头"></textarea>
                            </div>
                            <div class="col-6">
                                <label class="form-label">地址</label>
                                <textarea class="form-control" id="customerAddress" rows="2" placeholder="收货地址"></textarea>
                            </div>
                        </div>
                        <div id="batchSmartBox" class="mt-1 mb-2">
                            <textarea class="form-control form-control-sm" id="batchSmartInput" rows="3" placeholder="粘贴含客户信息的文本..."></textarea>
                            <button type="button" class="btn btn-outline-secondary btn-sm mt-1" onclick="smartFillBatch()">🔍 识别填充</button>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">快递公司</label>
                                <input type="text" class="form-control" id="courierCompany" placeholder="例如：顺丰">
                            </div>
                            <div class="col-6">
                                <label class="form-label">快递单号</label>
                                <input type="text" class="form-control" id="trackingNumber" placeholder="例如：SF123456">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" id="remarks" rows="2" placeholder="整机/套件出库说明"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="submitBtn" disabled>
                            <i class="bi bi-box-arrow-right"></i> <span id="submitText">请先选择物料</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:99999;">
    <div id="resultToast" class="toast"><div class="toast-body" id="toastBody"></div></div>
</div>

<script src="https://cdn.staticfile.org/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script>
// ====== 品类数据 ======
const CAT_DATA = {
    {% for cat in categories %}
    {{ cat.id }}: {
        name: "{{ cat.name }}",
        subs: [{% for s in cat.subs %}{id:{{ s.id }},name:"{{ s.name }}"}{% if not loop.last %},{% endif %}{% endfor %}]
    }{% if not loop.last %},{% endif %}
    {% endfor %}
};

// ====== 状态管理 ======
let selected = {};  // {sn: status}

// ====== Toast ======
function st(m,ok){var e=document.getElementById('resultToast');document.getElementById('toastBody').textContent=m;e.classList.add(ok?'bg-success':'bg-danger','text-white');new bootstrap.Toast(e).show();}

// ====== 智能解析客户信息 ======
function smartParse(text){
    var r={name:'',contact:'',company:'',address:''};
    // 规范化：· 在某些格式中用作地区分隔符（如 四川·成都）
    var t=text.replace(/·/g,'');
    // 用于地址正则的文本（去空白，避免空格切断地址连续性）
    var at=t.replace(/\s+/g,'');
    var m;

    // ====== 1. 手机号 ======
    // 1a. 粘连姓名+手机（最高置信度）：唐咏贤13326765299
    m=t.match(/([一-龥]{2,4})1[3-9]\d{9}/);
    if(m){r.contact=m[0].slice(-11);r.name=m[1];}
    // 1b. 独立手机号
    if(!r.contact){m=t.match(/1[3-9]\d{9}/);if(m)r.contact=m[0];}
    // 1c. 座机
    if(!r.contact){m=t.match(/0\d{2,3}[-\s]?\d{7,8}/);if(m)r.contact=m[0];}
    // 1d. 标签式电话
    if(!r.contact){m=t.match(/(?:电话|手机|联系方式|Tel)[：:]\s*(\d[\d\-\s]{6,15})/);if(m)r.contact=m[1].replace(/\s/g,'');}

    // ====== 2. 姓名 ======
    // 2a. 部门前缀+姓名（高置信度）：售后部吕燕梅
    if(!r.name){m=t.match(/(?:售后部|技术部|销售部|客服部|财务部|行政部|采购部|生产部|质检部|研发部|市场部)([一-龥]{2,4})/);if(m)r.name=m[1];}
    // 2b. 姓名+收：孙晨光收
    if(!r.name){m=t.match(/([一-龥]{2,4})收/);if(m)r.name=m[1];}
    // 2c. 标签式姓名
    if(!r.name){m=t.match(/(?:联系人|姓名|名字|收货人|客户|收件人)[：:]\s*([一-龥]{2,4})/);if(m)r.name=m[1];}
    // 2d. 手机号前面紧邻的姓名（允许1-2个分隔符：空格/逗号/tab）
    if(r.contact&&!r.name){
        var idx=t.indexOf(r.contact);
        if(idx>0){m=t.substring(0,idx).match(/([一-龥]{2,4})[\s，,、\t]{0,2}$/);if(m)r.name=m[1];}
    }
    // 2e. 手机号后面紧邻的姓名
    if(r.contact&&!r.name){
        var idx=t.indexOf(r.contact)+r.contact.length;
        if(idx<t.length){m=t.substring(idx).match(/^[\s，,、\t]{0,2}([一-龥]{2,4})/);if(m&&!/[省市县区镇乡路街道巷号公司集团科技有限实业厂部科园]/.test(m[1]))r.name=m[1];}
    }

    // ====== 3. 公司名 ======
    // 3a. 强后缀：有限公司|有限责任公司|股份有限公司|合伙企业
    m=t.match(/([一-龥]{3,30}(?:有限公司|有限责任公司|股份有限公司|合伙企业))/);
    // 3b. 中等后缀：X公司|工作室|商行|经营部|办事处|中心
    if(!m){m=t.match(/([一-龥]{2,20}(?:集团公司|科技公司|电子公司|实业公司|通讯公司|智能公司|信息公司|网络公司|激光公司|光电公司|机械公司|自动化公司|设备公司|器材公司|数控公司|机器人公司|精工公司|能源公司|材料公司|工作室|商行|经营部|办事处|中心))/);}
    // 3c. 弱关键词（需要≥2个前导字）：科技|电子|激光|厂|场|部
    if(!m){m=t.match(/([一-龥]{2,20}(?:科技|电子|实业|通讯|智能|信息|网络|激光|光电|机械|自动化|设备|器材|数控|机器人|精工|能源|材料|厂|场|部))/);
        if(m){var nc=t.charAt(m.index+m[0].length);if(/[园路街镇区号栋幢楼室层座巷]/.test(nc))m=null;}
    }
    if(m)r.company=m[0].replace(/^[号栋幢层楼室门座]+/,'');
    if(r.company&&(r.company.length>15||/[路街号栋幢楼室层座园]/.test(r.company))){
        var better=r.company.match(/.*(?:[园路街镇区号栋幢楼室层座巷口内院]|[\s，,、\t])([一-龥]{3,20}(?:有限公司|有限责任公司|股份有限公司|合伙企业|集团公司|科技公司|工作室|商行|经营部|办事处|中心|公司|科技|电子|实业|通讯|智能|信息|网络|激光|光电|机械|自动化|设备|器材|数控|机器人|精工|能源|材料|厂|场|部))$/);
        if(better)r.company=better[1];
    }
    // 3d. 标签式公司
    if(!r.company){m=t.match(/(?:公司|单位|抬头|工厂|工作室)[：:]\s*([一-龥]{2,30})/);if(m)r.company=m[1];}

    // ====== 4. 地址（标签式） ======
    // 4a. 所在地区
    m=t.match(/(?:所在地区|地区)[：:]\s*([^\n\r]+)/);
    if(m){var area=m[1].trim();if(!/(?:有限公司|有限责任公司|股份有限公司|合伙企业|集团公司|公司|工厂|工作室)/.test(area))r.address=area;}
    // 4b. 详细地址（可能实际是公司名，如"详细地址：XX有限公司"）
    if(!r.address){m=t.match(/(?:详细地址)[：:]\s*([^\n\r]+)/);if(m){
        var da=m[1].trim();
        if(/(?:有限公司|有限责任公司|股份有限公司|合伙企业)/.test(da)){if(!r.company)r.company=da;}
        else r.address=da;
    }}
    // 4c. 地址/收货地址
    if(!r.address){m=t.match(/(?:收货地址|地址|住址|收货地)[：:]\s*([^\n\r]+)/);if(m){
        var da2=m[1].trim();
        if(/(?:有限公司|有限责任公司|股份有限公司|合伙企业)/.test(da2)){if(!r.company)r.company=da2;}
        else r.address=da2;
    }}

    // ====== 5. 片段遍历（按换行/逗号/tab拆分，补充识别公司/姓名/地址） ======
    var segs=[];
    var lines=t.split(/[\n\r]+/);
    for(var i=0;i<lines.length;i++){
        var parts=lines[i].split(/[，,\t]+/);
        for(var j=0;j<parts.length;j++){var s=parts[j].trim();if(s)segs.push(s);}
    }
    for(var i=0;i<segs.length;i++){
        var seg=segs[i];
        // 手机号
        if(!r.contact){var pm=seg.match(/1[3-9]\d{9}/);if(pm)r.contact=pm[0];}
        // 公司名
        if(!r.company&&/[一-龥].*(?:有限公司|有限责任公司|股份有限公司|合伙企业|集团公司|科技公司|工作室|商行|经营部|办事处|中心|公司|集团|科技|电子|实业|通讯|智能|信息|网络|激光|光电|机械|自动化|设备|器材|数控|机器人|精工|能源|材料|厂)[一-龥]*$/.test(seg)){r.company=seg;}
        // 地址片段（含地址特征字，且未被标签式捕获时）
        if(!r.address&&seg.length>4&&/[省市县区镇乡路街道巷号栋幢楼室层座园\d]/.test(seg)){
            var useSeg=seg;
            // 若片段中含手机号，尝试从省/市级模式截取纯地址部分
            if(r.contact&&seg.indexOf(r.contact)>=0){
                var am=seg.match(/([一-齥]{2,15}(?:省|市|区|县).+)/);
                if(am){useSeg=am[1];}else{useSeg='';}
            }
            if(useSeg){
                // 切掉末尾嵌入的公司名
                if(r.company){var ci=useSeg.indexOf(r.company);if(ci>0&&/[路街巷号栋幢楼室层座园厂区内院\d]/.test(useSeg.substring(0,ci))){useSeg=useSeg.substring(0,ci).replace(/[，,\s]+$/,'');}}
                r.address=useSeg;
            }
        }
        // 姓名（纯中文2-4字，不含地址/公司特征字）
        if(!r.name&&!/[省市县区镇乡路街道巷号公司集团科技有限实业厂部科园\d]/.test(seg)){
            var nm=seg.match(/^([一-龥]{2,4})[收]?$/);
            if(nm)r.name=nm[1];
        }
    }

    // ====== 6. 地址兜底：省市区路号正则（在去空白文本上匹配） ======
    if(!r.address){
        m=at.match(/([一-齥]{2,15}(?:省|市|区)[一-龥]{2,60}(?:开发区|高新区|保税区|产业园区|产业园|工业区|工业园|园区|基地|新城|新区|省|市|区|县|镇|乡|街道|路|街|道|巷|大道).+)/);
        if(m)r.address=cleanAddress(m[1],r);
    }
    // 6b. 市级地址（无省份前缀，如 成都市双流区...）
    if(!r.address){
        m=at.match(/([一-齥]{2,15}(?:市|区|县)[一-龥]{2,60}(?:开发区|高新区|保税区|产业园区|产业园|工业区|工业园|园区|基地|新城|新区|镇|乡|街道|路|街|道|巷|大道).+)/);
        if(m)r.address=cleanAddress(m[1],r);
    }

    // ====== 7. 地址后处理：如果公司名嵌在地址中间，切掉 ======
    if(r.address&&r.company){
        var ci=r.address.indexOf(r.company);
        if(ci>0){
            var before=r.address.substring(0,ci);
            if(/[路街巷号栋幢楼室层座园厂区内院\d]/.test(before)){
                r.address=before.replace(/[，,\s]+$/,'').trim();
            }
        }
    }

    return r;
}
function cleanAddress(raw,r){
    var addr=raw.replace(/[\n\r].*/,'');
    // 从尾部依次裁掉已识别的电话、姓名、公司名（只裁末尾，保留嵌入在地址中间的）
    var trimList=[];
    if(r.contact)trimList.push(r.contact);
    if(r.name)trimList.push(r.name);
    if(r.company)trimList.push(r.company);
    for(var t=0;t<trimList.length;t++){
        var s=trimList[t];
        var idx=addr.lastIndexOf(s);
        if(idx>=0&&(addr.length-idx-s.length)<=3)addr=addr.substring(0,idx);
    }
    addr=addr.replace(/[\s,，。、\-\#]+$/,'').trim();
    // 尾部清洗：裁掉逗号/空格分隔的残余短中文片段（部门名/不完整公司名等非地址内容）
    addr=addr.replace(/[，,\s]+([一-龥a-zA-Z\d]{2,8})$/,function(match,frag){
        if(/[路街镇区市省县乡号栋幢楼室层座园巷门厂]$/.test(frag))return match;
        if(/^(?:售后|技术|销售|客服|财务|行政|采购|生产|质检|研发|市场)/.test(frag))return'';
        return'';
    });
    return addr;
}

function smartFillBatch(){
    var p=smartParse(document.getElementById('batchSmartInput').value);
    if(p.name)document.getElementById('customerName').value=p.name;
    else if(p.company)document.getElementById('customerName').value=p.company;
    if(p.contact)document.getElementById('customerContact').value=p.contact;
    if(p.company)document.getElementById('customerCompany').value=p.company;
    if(p.address)document.getElementById('customerAddress').value=p.address;
    if(!p.name&&!p.company&&!p.contact&&!p.address)st('未能识别到客户信息，请手动输入',false);
}

// ====== 品类筛选 ======
function onParentChange() {
    var pid = document.getElementById('parentSelect').value;
    var subSel = document.getElementById('subSelect');
    subSel.innerHTML = '<option value="">-- 小类 --</option>';
    subSel.disabled = !pid;
    if (pid && CAT_DATA[pid]) {
        CAT_DATA[pid].subs.forEach(function(s){
            subSel.innerHTML += '<option value="'+s.id+'">'+s.name+'</option>';
        });
    }
    clearPickArea();
}

function onSubChange() {
    var cid = document.getElementById('subSelect').value;
    if (!cid) { clearPickArea(); return; }
    loadInStock(cid);
}

async function loadInStock(catId) {
    var area = document.getElementById('searchResults');
    area.innerHTML = '<div class="text-center text-muted py-2"><span class="spinner-border spinner-border-sm"></span> 加载中...</div>';
    try {
        var r = await fetch('/api/in_stock_sns?cat=' + catId);
        var data = await r.json();
        if (!data.length) {
            area.innerHTML = '<div class="text-muted text-center py-2">该品类下无在库物料</div>';
            return;
        }
        renderPickChips(data);
    } catch(e) { area.innerHTML = '<div class="text-danger text-center py-2">加载失败</div>'; }
}

function renderPickChips(items) {
    var area = document.getElementById('searchResults');
    area.innerHTML = '<div class="text-muted small mb-1">共 <strong>'+items.length+'</strong> 件在库（点击添加）：</div>'
        + items.map(function(item){
            var picked = !!selected[item.sn];
            var cls = picked ? 'sn-pick picked' : 'sn-pick';
            return '<span class="'+cls+'"'
                + (picked ? '' : ' onclick="pickSn(\''+item.sn+'\',\''+item.status+'\')"')
                + ' title="'+item.sn+(item.hw_version?' HW:'+item.hw_version:'')+(item.sw_version?' SW:'+item.sw_version:'')+'">'
                + item.sn + '</span>';
        }).join('');
}

function pickSn(sn, status) {
    addSn(sn, status);
    // 刷新当前品类的点选区
    var cid = document.getElementById('subSelect').value;
    if (cid) loadInStock(cid);
}

function clearPickArea() {
    document.getElementById('searchResults').innerHTML = '<div class="text-muted text-center py-3"><i class="bi bi-arrow-up"></i> 选择品类后可点选在库物料</div>';
}

// ====== 关键词搜索（辅助） ======
let searchTimer;
document.getElementById('searchInput').addEventListener('input', function(){
    clearTimeout(searchTimer);
    var q = this.value.trim();
    if (q.length < 2) {
        // 如果品类已选则恢复品类结果
        var cid = document.getElementById('subSelect').value;
        if (cid) loadInStock(cid); else clearPickArea();
        return;
    }
    searchTimer = setTimeout(function(){ doSearch(q); }, 300);
});

async function doSearch(q) {
    var container = document.getElementById('searchResults');
    container.innerHTML = '<div class="text-center text-muted py-2"><span class="spinner-border spinner-border-sm"></span> 搜索中...</div>';
    try {
        var r = await fetch('/api/search_sn?q=' + encodeURIComponent(q));
        var data = await r.json();
        if (!data.length) {
            container.innerHTML = '<div class="text-muted text-center py-2">无匹配结果</div>';
            return;
        }
        container.innerHTML = data.map(function(item){
            var added = !!selected[item.sn];
            var cls = added ? 'search-result disabled' : 'search-result';
            var badge = item.status === '在库'
                ? '<span class="badge bg-success">在库</span>'
                : '<span class="badge bg-secondary">'+item.status+'</span>';
            var cat = item.parent_name ? (item.parent_name + ' → ' + (item.cat_name||'-')) : (item.cat_name||'未分类');
            var action = added ? '<span class="badge bg-primary">已添加</span>'
                : (item.status === '在库'
                    ? '<button class="btn btn-sm btn-outline-primary">+ 添加</button>'
                    : '<span class="text-muted small">不可出库</span>');
            return '<div class="d-flex justify-content-between align-items-center border-bottom py-2 px-2 '+cls+'"'
                + (added||item.status!=='在库'?'':' onclick="addSn(\''+item.sn+'\',\''+item.status+'\')"')
                + '>'
                + '<div><span class="fw-bold text-primary" style="font-family:monospace;">'+item.sn+'</span> '
                + '<small class="text-muted">'+cat+'</small> '+badge+'</div>'
                + action + '</div>';
        }).join('');
    } catch(e) { container.innerHTML = '<div class="text-danger text-center py-2">搜索失败</div>'; }
}

function clearAllFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('parentSelect').value = '';
    document.getElementById('subSelect').innerHTML = '<option value="">-- 小类 --</option>';
    document.getElementById('subSelect').disabled = true;
    clearPickArea();
}

// ====== 选中管理 ======
function addSn(sn, status) {
    if (selected[sn]) return;
    selected[sn] = status;
    refreshList();
}

function removeSn(sn) {
    delete selected[sn];
    refreshList();
    // 刷新品类点选区
    var cid = document.getElementById('subSelect').value;
    if (cid) loadInStock(cid);
}

function clearAll() {
    selected = {};
    refreshList();
    var cid = document.getElementById('subSelect').value;
    if (cid) loadInStock(cid);
}

function refreshList() {
    var container = document.getElementById('selectedList');
    var sns = Object.keys(selected);
    var count = sns.length;
    document.getElementById('countBadge').textContent = count;
    document.getElementById('clearAllBtn').disabled = count === 0;
    document.getElementById('submitBtn').disabled = count === 0;
    document.getElementById('submitText').textContent = count > 0
        ? '提交批量出库（'+count+' 件）' : '请先选择物料';

    if (count === 0) {
        container.innerHTML = '<div class="text-muted text-center py-3" id="emptyHint">'
            + '<i class="bi bi-inbox" style="font-size:2rem;"></i>'
            + '<p class="mt-1 mb-0">选择品类点选或搜索添加物料</p></div>';
        return;
    }

    container.innerHTML = sns.map(function(sn){
        var st = selected[sn];
        var ok = st === '在库';
        var cls = ok ? 'sn-chip' : 'sn-chip not-ok';
        var tip = ok ? '在库，可出库' : '状态: '+st+' (出库时将跳过)';
        return '<span class="'+cls+'" title="'+tip+'">'+sn
            + (ok ? '' : ' <small>('+st+')</small>')
            + '<span class="remove" onclick="removeSn(\''+sn+'\')">&times;</span></span>';
    }).join('');
}

// ====== 用途联动 ======
document.getElementById('purpose').addEventListener('change', function(){
    var box = document.getElementById('purposeDetailBox');
    var label = document.getElementById('purposeDetailLabel');
    var retGroup = document.getElementById('returnCheckGroup');
    var v = this.value;
    if (v === '销售出库') { box.style.display='block'; label.textContent='客户信息/销售备注'; retGroup.style.display='none'; }
    else if (v === '售后出库') { box.style.display='block'; label.textContent='售后原因'; retGroup.style.display=''; }
    else if (v === '测试出库') { box.style.display='block'; label.textContent='测试原因'; retGroup.style.display='none'; }
    else if (v === '其他出库') { box.style.display='block'; label.textContent='出库说明'; retGroup.style.display='none'; }
    else { box.style.display='none'; retGroup.style.display='none'; }
});

// ====== 提交 ======
document.getElementById('batchForm').addEventListener('submit', function(e){
    e.preventDefault();
    // 筛选在库的
    var okSns = Object.keys(selected).filter(function(sn){ return selected[sn] === '在库'; });
    if (okSns.length === 0) {
        st('所选物料均不在库，无法出库', false);
        return;
    }
    var total = Object.keys(selected).length;
    var skip = total - okSns.length;
    var confirmMsg = '确认批量出库 ' + okSns.length + ' 件物料？';
    if (skip > 0) confirmMsg += '\n（跳过 '+skip+' 件非在库物料）';
    if (!confirm(confirmMsg)) return;

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 提交中...';

    var payload = {
        sns: okSns,
        purpose: document.getElementById('purpose').value,
        purpose_detail: document.getElementById('purposeDetail').value.trim(),
        customer_name: document.getElementById('customerName').value.trim(),
        customer_contact: document.getElementById('customerContact').value.trim(),
        customer_company: document.getElementById('customerCompany').value.trim(),
        address: document.getElementById('customerAddress').value.trim(),
        courier_company: document.getElementById('courierCompany').value.trim(),
        tracking_number: document.getElementById('trackingNumber').value.trim(),
        remarks: document.getElementById('remarks').value.trim()
    };
    if(payload.purpose==='售后出库' && document.getElementById('needReturn').checked){
        payload.return_status='待寄回';
        payload.return_sn=document.getElementById('returnSn').value.trim();
        payload.return_courier=document.getElementById('returnCourier').value.trim();
        payload.return_tracking=document.getElementById('returnTracking').value.trim();
    }

    fetch('/api/outbound/batch', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); }).then(function(d){
        st(d.message, d.success);
        if (d.success) {
            selected = {};
            document.getElementById('batchForm').reset();
            document.getElementById('purposeDetailBox').style.display = 'none';
        }
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-right"></i> <span id="submitText">请先选择物料</span>';
        if (d.success) refreshList();
    }).catch(function(){
        st('网络错误', false);
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-right"></i> <span id="submitText">请先选择物料</span>';
    });
});

// ====== 智能返回 ======
document.getElementById('backBtn').addEventListener('click', function(e){
    try{var r=new URL(document.referrer);if(r.host===location.host&&r.pathname!==location.pathname){e.preventDefault();history.back();}}catch(e){}
});
</script>
