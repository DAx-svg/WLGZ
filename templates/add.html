<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加物料</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; background: #f5f7fa; }
    </style>
</head>
<body>
<div class="container">

    <div class="mb-3">
        <a href="/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> 返回首页</a>
    </div>

    <h3 class="mb-4"><i class="bi bi-plus-circle"></i> 添加新物料</h3>

    <ul class="nav nav-tabs" id="addTab">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#singlePanel">单个添加</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#batchPanel">批量添加</button></li>
    </ul>

    <div class="tab-content pt-3">

        <!-- ====== 单个添加 ====== -->
        <div class="tab-pane fade show active" id="singlePanel">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form id="singleForm">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">SN <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="singleSn" required placeholder="SN-2024-006">
                                    <button class="btn btn-outline-secondary" type="button" onclick="checkSn()">校验</button>
                                    <button class="btn btn-outline-info" type="button" id="singleFillBtn" title="查找相似SN并自动填充信息"><i class="bi bi-search"></i> 填充</button>
                                </div>
                                <div class="form-text" id="snFeedback"></div>
                                <div id="snSimilarHint" class="mt-1" style="display:none;"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">品类（小类）</label>
                                <select class="form-select" id="singleCat">
                                    <option value="">-- 不分类 --</option>
                                    {% for c in cats %}
                                    <option value="{{ c.id }}">{{ c.parent_name }} → {{ c.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">硬件版本</label>
                                <input type="text" class="form-control" id="singleHw" placeholder="V1.0">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">软件版本</label>
                                <input type="text" class="form-control" id="singleSw" placeholder="FW-1.0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">硬件功能描述</label>
                                <textarea class="form-control" id="singleHwDesc" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">软件功能描述</label>
                                <textarea class="form-control" id="singleSwDesc" rows="2"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">备注</label>
                                <textarea class="form-control" id="singleRemarks" rows="2"></textarea>
                            </div>
                            <div class="col-12">
                                <!-- 同类SN参考 -->
                                <div id="singleCatRef" class="mt-2" style="display:none;">
                                    <h6 class="text-muted small mb-1"><i class="bi bi-collection"></i> 同类SN参考（最近添加）</h6>
                                    <div class="table-responsive" style="max-height:240px;overflow-y:auto;">
                                        <table class="table table-sm table-hover small align-middle mb-0">
                                            <thead class="table-light sticky-top">
                                                <tr>
                                                    <th>SN</th>
                                                    <th>硬件版本</th>
                                                    <th>软件版本</th>
                                                    <th>硬件描述</th>
                                                    <th>软件描述</th>
                                                    <th>入库</th>
                                                </tr>
                                            </thead>
                                            <tbody></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary" id="singleBtn">
                                    <i class="bi bi-check-lg"></i> 添加物料
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- ====== 批量添加 ====== -->
        <div class="tab-pane fade" id="batchPanel">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form id="batchForm">
                        <div class="row g-3">
                            <!-- 序列号生成器 -->
                            <div class="col-12">
                                <div class="border rounded p-3 bg-light">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <span class="fw-bold small"><i class="bi bi-calculator"></i> 序列号生成器</span>
                                        <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#seqGenBody">展开/收起</button>
                                    </div>
                                    <div class="collapse" id="seqGenBody">
                                        <div class="row g-2">
                                            <div class="col-md-3">
                                                <label class="form-label small mb-0">前缀</label>
                                                <input type="text" class="form-control form-control-sm" id="seqPrefix" placeholder="如 SN-">
                                            </div>
                                            <div class="col-md-2">
                                                <label class="form-label small mb-0">起始编号</label>
                                                <input type="number" class="form-control form-control-sm" id="seqStart" value="1" min="1">
                                            </div>
                                            <div class="col-md-2">
                                                <label class="form-label small mb-0">结束编号</label>
                                                <input type="number" class="form-control form-control-sm" id="seqEnd" value="1" min="1">
                                            </div>
                                            <div class="col-md-2">
                                                <label class="form-label small mb-0">补零位数 <span class="text-muted">(0=自动)</span></label>
                                                <input type="number" class="form-control form-control-sm" id="seqPad" value="0" min="0" max="10">
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label small mb-0">后缀</label>
                                                <input type="text" class="form-control form-control-sm" id="seqSuffix" placeholder="如 -A">
                                            </div>
                                            <div class="col-12 mt-1">
                                                <button class="btn btn-primary btn-sm" type="button" onclick="generateSequence()">
                                                    <i class="bi bi-lightning"></i> 生成序列并填入下方
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- SN 输入区 -->
                            <div class="col-12">
                                <label class="form-label">SN 列表 <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="batchSns" rows="6"
                                    placeholder="换行、逗号、分号、冒号、顿号分隔&#10;SN-2024-006&#10;SN-2024-007"
                                    style="font-family:monospace;"></textarea>
                                <div class="mt-1 d-flex gap-2 flex-wrap">
                                    <button class="btn btn-outline-info btn-sm" type="button" id="batchFillBtn" title="用第一个SN查找相似物料并填充"><i class="bi bi-search"></i> 查找相似SN填充</button>
                                    <button class="btn btn-outline-warning btn-sm" type="button" id="undoBtn" onclick="undoSnList()" title="撤销上次生成/修改"><i class="bi bi-arrow-counterclockwise"></i> 撤销</button>
                                    <button class="btn btn-outline-success btn-sm" type="button" id="redoBtn" onclick="redoSnList()" title="恢复被撤销的内容"><i class="bi bi-arrow-clockwise"></i> 恢复</button>
                                    <span id="batchSimilarHint" style="display:none;"></span>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">品类（小类）</label>
                                <select class="form-select" id="batchCat">
                                    <option value="">-- 不分类 --</option>
                                    {% for c in cats %}
                                    <option value="{{ c.id }}">{{ c.parent_name }} → {{ c.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">硬件版本</label>
                                <input type="text" class="form-control" id="batchHw">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">软件版本</label>
                                <input type="text" class="form-control" id="batchSw">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">硬件功能描述</label>
                                <textarea class="form-control" id="batchHwDesc" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">软件功能描述</label>
                                <textarea class="form-control" id="batchSwDesc" rows="2"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">备注</label>
                                <textarea class="form-control" id="batchRemarks" rows="2"></textarea>
                            </div>
                            <div class="col-12">
                                <!-- 同类SN参考 -->
                                <div id="batchCatRef" class="mt-2" style="display:none;">
                                    <h6 class="text-muted small mb-1"><i class="bi bi-collection"></i> 同类SN参考（最近添加）</h6>
                                    <div class="table-responsive" style="max-height:240px;overflow-y:auto;">
                                        <table class="table table-sm table-hover small align-middle mb-0">
                                            <thead class="table-light sticky-top">
                                                <tr>
                                                    <th>SN</th>
                                                    <th>硬件版本</th>
                                                    <th>软件版本</th>
                                                    <th>硬件描述</th>
                                                    <th>软件描述</th>
                                                    <th>入库</th>
                                                </tr>
                                            </thead>
                                            <tbody></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary" id="batchBtn">
                                    <i class="bi bi-check-lg"></i> 批量添加
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:99999;">
    <div id="resultToast" class="toast"><div class="toast-body" id="toastBody"></div></div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script>
function st(m,ok){var e=document.getElementById('resultToast');document.getElementById('toastBody').textContent=m;e.classList.add(ok?'bg-success':'bg-danger','text-white');new bootstrap.Toast(e).show();}

async function checkSn(){
    var sn=document.getElementById('singleSn').value.trim();
    if(!sn){document.getElementById('snFeedback').innerHTML='';return;}
    try{
        var r=await fetch('/api/check_sn/'+encodeURIComponent(sn));
        var d=await r.json();
        document.getElementById('snFeedback').innerHTML=d.exists
            ?'<span class="text-danger">已存在</span>'
            :'<span class="text-success">可用</span>';
    }catch(e){}
}
document.getElementById('singleSn').addEventListener('blur',checkSn);

// ====== SN 相似度自动填充 ======

async function autoFillFromSimilar(sn, isBatch){
    var hintEl = document.getElementById(isBatch ? 'batchSimilarHint' : 'snSimilarHint');
    hintEl.style.display = 'none';
    hintEl.innerHTML = '';
    if(sn.length < 4){ st('SN太短，至少4个字符', false); return; }

    // 单个添加模式：SN 已存在时跳过
    if(!isBatch){
        try {
            var chk = await fetch('/api/check_sn/' + encodeURIComponent(sn));
            var chkData = await chk.json();
            if(chkData.exists){ st('该SN已存在，无需填充', false); return; }
        } catch(e) { return; }
    }

    try {
        var r = await fetch('/api/similar_sn/' + encodeURIComponent(sn));
        var d = await r.json();
        if(!d.found){ st('未找到相似SN（相似度不足85%）', false); return; }

        var prefix = isBatch ? 'batch' : 'single';
        var filled = [];
        var similarRemarks = d.remarks || '';

        var fields = [
            ['Cat', 'category_id'],
            ['Hw', 'hw_version'],
            ['Sw', 'sw_version'],
            ['HwDesc', 'hw_description'],
            ['SwDesc', 'sw_description']
        ];

        fields.forEach(function(f){
            var el = document.getElementById(prefix + f[0]);
            if(el && d[f[1]]){
                el.value = d[f[1]];
                filled.push(f[0]);
            }
        });

        if(filled.length > 0){
            var pct = Math.round(d.similarity * 100);
            hintEl.style.display = '';
            hintEl.innerHTML = ' <span class="badge bg-info"><i class="bi bi-magic"></i> 已从 <strong>'
                + d.similar_sn + '</strong> 填充 ' + filled.length + ' 项 (相似度 ' + pct + '%)</span>'
                + ' <a href="#" class="ms-1 text-decoration-none small text-secondary undo-fill-link">撤销</a>'
                + (similarRemarks ? ' <a href="#" class="ms-1 text-decoration-none small text-info remarks-fill-link" title="点击填充备注">📋备注</a>' : '');
            hintEl.querySelector('.undo-fill-link').addEventListener('click', function(e){
                e.preventDefault();
                undoAutoFill(isBatch);
            });
            if(similarRemarks){
                hintEl.querySelector('.remarks-fill-link').addEventListener('click', function(e){
                    e.preventDefault();
                    var remarksEl = document.getElementById(prefix + 'Remarks');
                    if(!remarksEl) return;
                    if(remarksEl.value === similarRemarks){
                        // 已填充 → 撤销备注
                        remarksEl.value = '';
                        this.innerHTML = '📋备注';
                        this.title = '点击填充备注';
                        saveFormData();
                        st('备注已撤销', true);
                    } else {
                        // 未填充 → 填充备注
                        remarksEl.value = similarRemarks;
                        this.innerHTML = '↩撤销备注';
                        this.title = '点击撤销备注';
                        saveFormData();
                        st('备注已填充', true);
                    }
                });
            }
            saveFormData();
        } else {
            st('所有字段已填写，无需自动填充', false);
        }
    } catch(e) { st('检索失败', false); }
}

function undoAutoFill(isBatch){
    var prefix = isBatch ? 'batch' : 'single';
    var hintEl = document.getElementById(isBatch ? 'batchSimilarHint' : 'snSimilarHint');
    ['Cat','Hw','Sw','HwDesc','SwDesc','Remarks'].forEach(function(f){
        var el = document.getElementById(prefix + f);
        if(el) el.value = '';
    });
    hintEl.style.display = 'none';
    hintEl.innerHTML = '';
    saveFormData();
    st('已撤销自动填充', true);
}

// ====== 同品类SN参考表格 ======
async function loadCatRef(catId, isBatch){
    var refEl = document.getElementById(isBatch ? 'batchCatRef' : 'singleCatRef');
    if(!catId){ refEl.style.display = 'none'; return; }
    try {
        var r = await fetch('/api/category_recent_sns/' + catId);
        var rows = await r.json();
        if(!rows || rows.length === 0){ refEl.style.display = 'none'; return; }
        refEl.style.display = '';
        var tbody = refEl.querySelector('tbody');
        tbody.innerHTML = rows.map(function(m){
            return '<tr>' +
                '<td><code style="font-size:0.85em;">' + (m.sn || '') + '</code></td>' +
                '<td>' + (m.hw_version || '-') + '</td>' +
                '<td>' + (m.sw_version || '-') + '</td>' +
                '<td class="text-truncate" style="max-width:140px;" title="' + (m.hw_description || '') + '">' + (m.hw_description || '-') + '</td>' +
                '<td class="text-truncate" style="max-width:140px;" title="' + (m.sw_description || '') + '">' + (m.sw_description || '-') + '</td>' +
                '<td class="text-nowrap small">' + (m.inbound_time || '').substring(0,10) + '</td>' +
                '</tr>';
        }).join('');
    } catch(e) { refEl.style.display = 'none'; }
}

document.getElementById('singleCat').addEventListener('change', function(){
    loadCatRef(this.value, false);
});
document.getElementById('batchCat').addEventListener('change', function(){
    loadCatRef(this.value, true);
});

// 手动触发按钮
document.getElementById('singleFillBtn').addEventListener('click', function(){
    var sn = document.getElementById('singleSn').value.trim();
    if(!sn){ st('请先输入SN', false); return; }
    autoFillFromSimilar(sn, false);
});

document.getElementById('batchFillBtn').addEventListener('click', function(){
    var text = document.getElementById('batchSns').value.trim();
    if(!text){ st('请先输入SN', false); return; }
    // 取第一行作为 SN 去匹配（避免冒号等分隔符误切前缀）
    var lines = text.split(/[\n\r]+/).filter(function(s){return s.trim();});
    if(lines.length === 0){ st('未解析到有效SN', false); return; }
    autoFillFromSimilar(lines[0].trim(), true);
});

async function doSubmit(formId, btnId, isBatch){
    var btn=document.getElementById(btnId);
    btn.disabled=true; btn.innerHTML='<span class="spinner-border spinner-border-sm"></span> 提交中...';

    var payload = isBatch ? {
        sns: document.getElementById('batchSns').value.trim(),
        category_id: document.getElementById('batchCat').value || null,
        hw_version: document.getElementById('batchHw').value.trim(),
        sw_version: document.getElementById('batchSw').value.trim(),
        hw_description: document.getElementById('batchHwDesc').value.trim(),
        sw_description: document.getElementById('batchSwDesc').value.trim(),
        remarks: document.getElementById('batchRemarks').value.trim()
    } : {
        sn: document.getElementById('singleSn').value.trim(),
        category_id: document.getElementById('singleCat').value || null,
        hw_version: document.getElementById('singleHw').value.trim(),
        sw_version: document.getElementById('singleSw').value.trim(),
        hw_description: document.getElementById('singleHwDesc').value.trim(),
        sw_description: document.getElementById('singleSwDesc').value.trim(),
        remarks: document.getElementById('singleRemarks').value.trim()
    };

    var url = isBatch ? '/api/material/batch_add' : '/api/material/add';
    try {
        var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        var d=await r.json();
        st(d.message, d.success);
        if(d.success){
            document.getElementById(formId).reset();
            // 清除当前表单的记忆数据
            var prefix = isBatch ? 'batch' : 'single';
            try {
                var data = JSON.parse(sessionStorage.getItem(FORM_KEY));
                if(data){ Object.keys(data).forEach(function(k){ if(k.indexOf(prefix)===0) delete data[k]; }); sessionStorage.setItem(FORM_KEY, JSON.stringify(data)); }
            } catch(e) {}
        }
    } catch(e) { st('网络错误',false); }
    btn.disabled=false;
    btn.innerHTML='<i class="bi bi-check-lg"></i> '+(isBatch?'批量添加':'添加物料');
}

document.getElementById('singleForm').addEventListener('submit',function(e){e.preventDefault();doSubmit('singleForm','singleBtn',false);});
document.getElementById('batchForm').addEventListener('submit',function(e){e.preventDefault();doSubmit('batchForm','batchBtn',true);});

// ====== 序列号生成器 ======
var snBefore = '';       // 生成前的文本
var snAfter = '';        // 生成后的文本
var snUndone = false;    // 当前是否处于撤销状态

function updateUndoRedoBtns(){
    var ub = document.getElementById('undoBtn');
    var rb = document.getElementById('redoBtn');
    if(snAfter === '' || snAfter === snBefore){
        ub.classList.add('opacity-50');
        rb.classList.add('opacity-50');
    } else if(snUndone){
        ub.classList.add('opacity-50');
        rb.classList.remove('opacity-50');
    } else {
        ub.classList.remove('opacity-50');
        rb.classList.add('opacity-50');
    }
}

function undoSnList(){
    if(snAfter === '' || snAfter === snBefore){ st('没有可撤销的操作，请先生成序列号', false); return; }
    if(snUndone){ st('已经撤销过了，点恢复按钮即可', false); return; }
    var ta = document.getElementById('batchSns');
    ta.value = snBefore;
    snUndone = true;
    ta.dispatchEvent(new Event('input', {bubbles:true}));
    ta.dispatchEvent(new Event('change', {bubbles:true}));
    updateUndoRedoBtns();
    st('已撤销，文本已恢复到生成前', true);
}

function redoSnList(){
    if(snAfter === '' || snAfter === snBefore){ st('没有可恢复的操作', false); return; }
    if(!snUndone){ st('尚未撤销，无需恢复', false); return; }
    var ta = document.getElementById('batchSns');
    ta.value = snAfter;
    snUndone = false;
    ta.dispatchEvent(new Event('input', {bubbles:true}));
    ta.dispatchEvent(new Event('change', {bubbles:true}));
    updateUndoRedoBtns();
    st('已恢复生成的序列号', true);
}

function generateSequence(){
    var prefix = document.getElementById('seqPrefix').value.trim();
    var suffix = document.getElementById('seqSuffix').value.trim();
    var start = parseInt(document.getElementById('seqStart').value) || 1;
    var end = parseInt(document.getElementById('seqEnd').value) || 1;
    var pad = parseInt(document.getElementById('seqPad').value) || 0;

    if(start > end){ st('起始编号不能大于结束编号', false); return; }
    if(end - start > 9999){ st('一次最多生成 10000 个序列号', false); return; }

    var digits = pad;
    if(digits === 0){ digits = String(end).length; }

    var sns = [];
    for(var i = start; i <= end; i++){
        var num = String(i).padStart(digits, '0');
        sns.push(prefix + num + suffix);
    }

    var ta = document.getElementById('batchSns');
    // 保存生成前状态
    snBefore = ta.value;
    // 追加生成内容
    var existing = ta.value.trim();
    if(existing){
        ta.value = existing + '\n' + sns.join('\n');
    } else {
        ta.value = sns.join('\n');
    }
    // 保存生成后状态
    snAfter = ta.value;
    snUndone = false;
    ta.dispatchEvent(new Event('input', {bubbles:true}));
    ta.dispatchEvent(new Event('change', {bubbles:true}));
    updateUndoRedoBtns();
    st('已生成 ' + sns.length + ' 个序列号', true);
}

// ====== 表单记忆：自动保存/恢复已填信息 ======
var FORM_KEY = 'addFormData';
function saveFormData(){
    var data = {};
    document.querySelectorAll('#singleForm input, #singleForm textarea, #singleForm select').forEach(function(el){
        if(el.id) data[el.id] = el.value;
    });
    document.querySelectorAll('#batchForm input, #batchForm textarea, #batchForm select').forEach(function(el){
        if(el.id) data[el.id] = el.value;
    });
    sessionStorage.setItem(FORM_KEY, JSON.stringify(data));
}
function restoreFormData(){
    try {
        var data = JSON.parse(sessionStorage.getItem(FORM_KEY));
        if(!data) return;
        Object.keys(data).forEach(function(id){
            var el = document.getElementById(id);
            if(el) el.value = data[id];
        });
        // 恢复品类选择后显示同类SN提示
        if(data.singleCat) loadCatRef(data.singleCat, false);
        if(data.batchCat) loadCatRef(data.batchCat, true);
    } catch(e) {}
}
// 所有字段输入时自动保存
document.querySelectorAll('#singleForm input, #singleForm textarea, #singleForm select, #batchForm input, #batchForm textarea, #batchForm select').forEach(function(el){
    el.addEventListener('input', saveFormData);
    el.addEventListener('change', saveFormData);
});
// 页面加载时恢复
restoreFormData();
</script>
</body>
</html>
