<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加物料 - 物料追溯系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; background: #f5f7fa; }
        .tab-content { padding-top: 20px; }
    </style>
</head>
<body>
<div class="container">

    <!-- 返回导航 -->
    <div class="mb-3">
        <a href="/" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> 返回物料列表
        </a>
    </div>

    <h3 class="mb-4"><i class="bi bi-plus-circle"></i> 添加新物料</h3>

    <!-- 标签切换：单个添加 / 批量添加 -->
    <ul class="nav nav-tabs" id="addTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="single-tab" data-bs-toggle="tab"
                    data-bs-target="#singlePanel" type="button" role="tab">
                <i class="bi bi-file-earmark-plus"></i> 单个添加
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="batch-tab" data-bs-toggle="tab"
                    data-bs-target="#batchPanel" type="button" role="tab">
                <i class="bi bi-files"></i> 批量添加
            </button>
        </li>
    </ul>

    <div class="tab-content" id="addTabContent">

        <!-- ==================== 单个添加 ==================== -->
        <div class="tab-pane fade show active" id="singlePanel" role="tabpanel">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form id="singleForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">SN（序列号）<span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="singleSn" required
                                           placeholder="例如 SN-2024-006" maxlength="100">
                                    <button class="btn btn-outline-secondary" type="button"
                                            onclick="checkSn('singleSn')">校验</button>
                                </div>
                                <div class="form-text" id="singleSnFeedback"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">硬件版本</label>
                                <input type="text" class="form-control" id="singleHwVer"
                                       placeholder="例如 V3.1" maxlength="50">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">软件版本</label>
                                <input type="text" class="form-control" id="singleSwVer"
                                       placeholder="例如 FW-4.0.1" maxlength="50">
                            </div>
                            <div class="col-12">
                                <label class="form-label">硬件功能描述</label>
                                <textarea class="form-control" id="singleHwDesc" rows="2"
                                          placeholder="描述该物料的硬件功能特性"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">软件功能描述</label>
                                <textarea class="form-control" id="singleSwDesc" rows="2"
                                          placeholder="描述该物料的软件功能特性"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">备注</label>
                                <input type="text" class="form-control" id="singleRemarks"
                                       placeholder="可选备注信息" maxlength="500">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary" id="singleSubmitBtn">
                                    <i class="bi bi-check-lg"></i> 添加物料
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- ==================== 批量添加 ==================== -->
        <div class="tab-pane fade" id="batchPanel" role="tabpanel">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form id="batchForm">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">SN 列表<span class="text-danger">*</span></label>
                                <textarea class="form-control" id="batchSns" rows="6"
                                          placeholder="粘贴多个SN，使用换行、逗号或分号分隔&#10;例如：&#10;SN-2024-006&#10;SN-2024-007&#10;SN-2024-008"
                                          style="font-family: monospace;"></textarea>
                                <div class="form-text">每件物料将拥有独立的SN，共享下方配置的版本和描述信息</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">硬件版本</label>
                                <input type="text" class="form-control" id="batchHwVer"
                                       placeholder="所有SN共用" maxlength="50">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">软件版本</label>
                                <input type="text" class="form-control" id="batchSwVer"
                                       placeholder="所有SN共用" maxlength="50">
                            </div>
                            <div class="col-12">
                                <label class="form-label">硬件功能描述</label>
                                <textarea class="form-control" id="batchHwDesc" rows="2"
                                          placeholder="所有SN共用"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">软件功能描述</label>
                                <textarea class="form-control" id="batchSwDesc" rows="2"
                                          placeholder="所有SN共用"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">备注</label>
                                <input type="text" class="form-control" id="batchRemarks"
                                       placeholder="所有SN共用" maxlength="500">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary" id="batchSubmitBtn">
                                    <i class="bi bi-check-lg"></i> 批量添加
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- 结果提示 Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
    <div id="resultToast" class="toast" role="alert">
        <div class="toast-header" id="toastHeader">
            <i class="bi me-2" id="toastIcon"></i>
            <strong class="me-auto" id="toastTitle"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toastBody"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ===================== SN 唯一性校验 =====================
async function checkSn(inputId) {
    const sn = document.getElementById(inputId).value.trim();
    const fb = document.getElementById(inputId + 'Feedback');
    if (!sn) { fb.innerHTML = ''; return; }

    try {
        const resp = await fetch('/api/check_sn/' + encodeURIComponent(sn));
        const data = await resp.json();
        if (data.exists) {
            fb.innerHTML = '<span class="text-danger"><i class="bi bi-exclamation-triangle"></i> 该SN已存在</span>';
        } else {
            fb.innerHTML = '<span class="text-success"><i class="bi bi-check-circle"></i> SN可用</span>';
        }
    } catch (e) {
        fb.innerHTML = '<span class="text-warning">校验失败</span>';
    }
}

document.getElementById('singleSn').addEventListener('blur', () => checkSn('singleSn'));

// ===================== Toast 提示 =====================
function showToast(title, message, success) {
    const toastEl = document.getElementById('resultToast');
    document.getElementById('toastIcon').className =
        success ? 'bi bi-check-circle text-success me-2' : 'bi bi-exclamation-circle text-danger me-2';
    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastBody').textContent = message;
    const toast = new bootstrap.Toast(toastEl);
    toast.show();
}

// ===================== 单个添加 =====================
document.getElementById('singleForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('singleSubmitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 提交中...';

    const payload = {
        sn: document.getElementById('singleSn').value.trim(),
        hw_version: document.getElementById('singleHwVer').value.trim(),
        sw_version: document.getElementById('singleSwVer').value.trim(),
        hw_description: document.getElementById('singleHwDesc').value.trim(),
        sw_description: document.getElementById('singleSwDesc').value.trim(),
        remarks: document.getElementById('singleRemarks').value.trim()
    };

    try {
        const resp = await fetch('/api/material/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await resp.json();
        showToast(data.success ? '成功' : '失败', data.message, data.success);
        if (data.success) {
            document.getElementById('singleForm').reset();
            document.getElementById('singleSnFeedback').innerHTML = '';
        }
    } catch (err) {
        showToast('错误', '网络请求失败，请检查服务器连接', false);
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-check-lg"></i> 添加物料';
});

// ===================== 批量添加 =====================
document.getElementById('batchForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('batchSubmitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 批量提交中...';

    const payload = {
        sns: document.getElementById('batchSns').value.trim(),
        hw_version: document.getElementById('batchHwVer').value.trim(),
        sw_version: document.getElementById('batchSwVer').value.trim(),
        hw_description: document.getElementById('batchHwDesc').value.trim(),
        sw_description: document.getElementById('batchSwDesc').value.trim(),
        remarks: document.getElementById('batchRemarks').value.trim()
    };

    try {
        const resp = await fetch('/api/material/batch_add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await resp.json();
        showToast(data.success ? '成功' : '失败', data.message, data.success);
        if (data.success) {
            document.getElementById('batchForm').reset();
        }
    } catch (err) {
        showToast('错误', '网络请求失败，请检查服务器连接', false);
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-check-lg"></i> 批量添加';
});
</script>
</body>
</html>
