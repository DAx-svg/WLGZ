<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加物料</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; background: #f5f7fa; }
    </style>
</head>
<body>
<div class="container">

    <div class="mb-3">
        <a href="/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> 返回首页</a>
    </div>

    <h3 class="mb-4"><i class="bi bi-plus-circle"></i> 添加新物料</h3>

    <ul class="nav nav-tabs" id="addTab">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#singlePanel">单个添加</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#batchPanel">批量添加</button></li>
    </ul>

    <div class="tab-content pt-3">

        <!-- ====== 单个添加 ====== -->
        <div class="tab-pane fade show active" id="singlePanel">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form id="singleForm">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">SN <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="singleSn" required placeholder="SN-2024-006">
                                    <button class="btn btn-outline-secondary" type="button" onclick="checkSn()">校验</button>
                                </div>
                                <div class="form-text" id="snFeedback"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">品类（小类）</label>
                                <select class="form-select" id="singleCat">
                                    <option value="">-- 不分类 --</option>
                                    {% for c in cats %}
                                    <option value="{{ c.id }}">{{ c.parent_name }} → {{ c.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">硬件版本</label>
                                <input type="text" class="form-control" id="singleHw" placeholder="V1.0">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">软件版本</label>
                                <input type="text" class="form-control" id="singleSw" placeholder="FW-1.0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">硬件功能描述</label>
                                <textarea class="form-control" id="singleHwDesc" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">软件功能描述</label>
                                <textarea class="form-control" id="singleSwDesc" rows="2"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">备注</label>
                                <textarea class="form-control" id="singleRemarks" rows="2"></textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary" id="singleBtn">
                                    <i class="bi bi-check-lg"></i> 添加物料
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- ====== 批量添加 ====== -->
        <div class="tab-pane fade" id="batchPanel">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form id="batchForm">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">SN 列表 <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="batchSns" rows="6"
                                    placeholder="换行、逗号或分号分隔&#10;SN-2024-006&#10;SN-2024-007"
                                    style="font-family:monospace;"></textarea>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">品类（小类）</label>
                                <select class="form-select" id="batchCat">
                                    <option value="">-- 不分类 --</option>
                                    {% for c in cats %}
                                    <option value="{{ c.id }}">{{ c.parent_name }} → {{ c.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">硬件版本</label>
                                <input type="text" class="form-control" id="batchHw">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">软件版本</label>
                                <input type="text" class="form-control" id="batchSw">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">硬件功能描述</label>
                                <textarea class="form-control" id="batchHwDesc" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">软件功能描述</label>
                                <textarea class="form-control" id="batchSwDesc" rows="2"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">备注</label>
                                <textarea class="form-control" id="batchRemarks" rows="2"></textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary" id="batchBtn">
                                    <i class="bi bi-check-lg"></i> 批量添加
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:99999;">
    <div id="resultToast" class="toast"><div class="toast-body" id="toastBody"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function st(m,ok){var e=document.getElementById('resultToast');document.getElementById('toastBody').textContent=m;e.classList.add(ok?'bg-success':'bg-danger','text-white');new bootstrap.Toast(e).show();}

async function checkSn(){
    var sn=document.getElementById('singleSn').value.trim();
    if(!sn){document.getElementById('snFeedback').innerHTML='';return;}
    try{
        var r=await fetch('/api/check_sn/'+encodeURIComponent(sn));
        var d=await r.json();
        document.getElementById('snFeedback').innerHTML=d.exists
            ?'<span class="text-danger">已存在</span>'
            :'<span class="text-success">可用</span>';
    }catch(e){}
}
document.getElementById('singleSn').addEventListener('blur',checkSn);

async function doSubmit(formId, btnId, isBatch){
    var btn=document.getElementById(btnId);
    btn.disabled=true; btn.innerHTML='<span class="spinner-border spinner-border-sm"></span> 提交中...';

    var payload = isBatch ? {
        sns: document.getElementById('batchSns').value.trim(),
        category_id: document.getElementById('batchCat').value || null,
        hw_version: document.getElementById('batchHw').value.trim(),
        sw_version: document.getElementById('batchSw').value.trim(),
        hw_description: document.getElementById('batchHwDesc').value.trim(),
        sw_description: document.getElementById('batchSwDesc').value.trim(),
        remarks: document.getElementById('batchRemarks').value.trim()
    } : {
        sn: document.getElementById('singleSn').value.trim(),
        category_id: document.getElementById('singleCat').value || null,
        hw_version: document.getElementById('singleHw').value.trim(),
        sw_version: document.getElementById('singleSw').value.trim(),
        hw_description: document.getElementById('singleHwDesc').value.trim(),
        sw_description: document.getElementById('singleSwDesc').value.trim(),
        remarks: document.getElementById('singleRemarks').value.trim()
    };

    var url = isBatch ? '/api/material/batch_add' : '/api/material/add';
    try {
        var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        var d=await r.json();
        st(d.message, d.success);
        if(d.success) document.getElementById(formId).reset();
    } catch(e) { st('网络错误',false); }
    btn.disabled=false;
    btn.innerHTML='<i class="bi bi-check-lg"></i> '+(isBatch?'批量添加':'添加物料');
}

document.getElementById('singleForm').addEventListener('submit',function(e){e.preventDefault();doSubmit('singleForm','singleBtn',false);});
document.getElementById('batchForm').addEventListener('submit',function(e){e.preventDefault();doSubmit('batchForm','batchBtn',true);});
</script>
</body>
</html>
